# LiveKit SFU. API keys come from the LIVEKIT_KEYS env var (see docker-compose.yml).
port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882          # single UDP port (muxed), easy to expose through docker/firewall
  use_external_ip: false  # node IP is passed via --node-ip
room:
  empty_timeout: 300
  departure_timeout: 20
logging:
  level: info
