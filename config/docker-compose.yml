# ConferX local stack.
#   cp config/.env.example config/.env   # then edit secrets
#   docker compose -f config/docker-compose.yml up -d --build
# Optional profiles: --profile monitoring (Prometheus + Grafana), --profile dashboard (APISIX dashboard),
#                    --profile kafka (Kafka + Zookeeper, not used yet)
name: conferx

x-restart: &restart
  restart: unless-stopped

services:
  # ---------------- Gateway ----------------
  etcd:
    <<: *restart
    image: quay.io/coreos/etcd:v3.5.17   # multi-arch (amd64 + arm64)
    command: ["/usr/local/bin/etcd"]
    environment:
      ETCD_NAME: etcd
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
    volumes:
      - etcd_data:/etcd-data
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 10s
      retries: 10

  apisix:
    <<: *restart
    image: apache/apisix:${APISIX_IMAGE_TAG:-3.12.0-debian}
    environment:
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:?set APISIX_ADMIN_KEY in config/.env}
    volumes:
      - ./apisix/apisix_conf/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    depends_on:
      etcd:
        condition: service_healthy
    ports:
      - "9080:9080"             # public gateway
      - "127.0.0.1:9180:9180"   # admin API (localhost only)

  apisix-init:
    image: curlimages/curl:8.10.1
    restart: "no"
    environment:
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:?set APISIX_ADMIN_KEY in config/.env}
    volumes:
      - ./apisix/init/routes.sh:/routes.sh:ro
    entrypoint: ["sh", "/routes.sh"]
    depends_on:
      - apisix

  # ---------------- Services ----------------
  rooms-db:
    <<: *restart
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${ROOMS_DB_PASSWORD:?set ROOMS_DB_PASSWORD in config/.env}
      POSTGRES_DB: conferx_rooms
    volumes:
      - rooms_db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d conferx_rooms"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-db:
    <<: *restart
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in config/.env}
      POSTGRES_DB: conferx_auth
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d conferx_auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    <<: *restart
    build:
      context: ../packages/auth-service
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      PORT: 3001
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      DB_NAME: conferx_auth
      USER_JWT_SECRET: ${USER_JWT_SECRET:?set USER_JWT_SECRET in config/.env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    # Not published: reach it through the gateway at http://localhost:9080/api/v1/auth

  room-service:
    <<: *restart
    build:
      context: ../packages/room-service
    depends_on:
      rooms-db:
        condition: service_healthy
    environment:
      PORT: 3002
      DB_HOST: rooms-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${ROOMS_DB_PASSWORD}
      DB_NAME: conferx_rooms
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in config/.env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in config/.env}
      USER_JWT_SECRET: ${USER_JWT_SECRET:?set USER_JWT_SECRET in config/.env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in config/.env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in config/.env}
      LIVEKIT_INTERNAL_URL: http://livekit:7880
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
    # Not published: reach it through the gateway at http://localhost:9080/api/v1/rooms

  # ---------------- Media (SFU) ----------------
  livekit:
    <<: *restart
    image: livekit/livekit-server:v1.13.7
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${LIVEKIT_NODE_IP:-127.0.0.1}"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"       # signaling (WebSocket)
      - "7881:7881"       # WebRTC over TCP fallback
      - "7882:7882/udp"   # WebRTC over UDP

  # ---------------- Optional ----------------
  zookeeper:
    profiles: ["kafka"]
    image: confluentinc/cp-zookeeper:7.3.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    profiles: ["kafka"]
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  apisix-dashboard:
    profiles: ["dashboard"]
    image: apache/apisix-dashboard:3.0.1-alpine
    volumes:
      - ./apisix/apisix_conf/dashboard_config.yaml:/usr/local/apisix-dashboard/conf/conf.yaml:ro
    ports:
      - "127.0.0.1:9000:9000"
    depends_on:
      etcd:
        condition: service_healthy

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.54.1
    volumes:
      - ./apisix/prometheus_conf/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.2.0
    ports:
      - "127.0.0.1:3030:3000"
    volumes:
      - ./apisix/grafana_conf/provisioning:/etc/grafana/provisioning
      - ./apisix/grafana_conf/dashboards:/var/lib/grafana/dashboards
      - ./apisix/grafana_conf/config/grafana.ini:/etc/grafana/grafana.ini

volumes:
  etcd_data:
  rooms_db_data:
  auth_db_data:
